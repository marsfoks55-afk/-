    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch || (window.fetch ? window.fetch.bind(window) : undefined);
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });

          if (window.Window && window.Window.prototype) {
            try {
              var desc = Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch');
              if (desc && !desc.set) {
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  get: function() {
                    return activeFetch || (window.fetch ? window.fetch.bind(window) : undefined);
                  },
                  set: function(fn) {
                    activeFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
