        <polygon points="170,215 230,190 230,220 170,245" fill="#facc15" opacity="0.7"/>
        <text x="205" y="157" fill="#080808" font-family="monospace" font-size="8" font-weight="bold" transform="rotate(-22 205 157)">999.9</text>
        
  </g>

  <!-- Bottom Title Label -->
  <text x="200" y="328" fill="#F5F5F5" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="3">GOLD RUSH</text>
  <text x="200" y="348" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="1">SERIES 2026 // CASE ID #ush</text>

