  <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1" stroke-dasharray="2 6"/>

  <!-- Border Card Frame -->
  <rect x="24" y="24" width="352" height="352" rx="12" fill="none" stroke="url(#frameGrad_case_premium_gold_rush)" stroke-width="1"/>

  <!-- Top Metadata Header -->
  <text x="44" y="54" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="2">CASER.GG // ORIGINALS</text>
  <text x="356" y="54" fill="#facc15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="end" letter-spacing="1">PREMIUM</text>

