      <stop offset="0%" stop-color="#facc15" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameGrad_case_premium_gold_rush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Deep Dark Minimal Canvas -->
  <rect width="400" height="400" fill="#080808"/>
  <rect width="400" height="400" fill="url(#bgGlow_case_premium_gold_rush)"/>

  <!-- Subtle Precision Grid Lines -->
