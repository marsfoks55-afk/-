  <!-- Top Metadata Header -->
  <text x="44" y="54" fill="#555555" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="2">CASER.GG // ORIGINALS</text>
  <text x="356" y="54" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" text-anchor="end" letter-spacing="1">STANDARD</text>

